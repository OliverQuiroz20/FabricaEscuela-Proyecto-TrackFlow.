services:
  - type: web
    name: trackflow-equipo
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      # Todos estos valores se definen en el dashboard de Render, nunca en este archivo.
      - key: TRACKFLOW_DB_URL
        sync: false
      - key: TRACKFLOW_DB_USER
        sync: false
      - key: TRACKFLOW_DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_SSL
        value: "true"
      # Sin clave de operador la escritura queda abierta: definirla siempre aquí.
      - key: TRACKFLOW_OPERADOR_CLAVE
        sync: false
      # Sin esta clave, /api/admin/** queda inaccesible (cerrado por defecto).
      - key: TRACKFLOW_ADMIN_CLAVE
        sync: false
      # Render genera el secreto de firma; si se regenera, los tokens vigentes caducan.
      - key: TRACKFLOW_JWT_SECRET
        generateValue: true
      # Dominio(s) del frontend, separados por comas. Sin él solo se admite localhost.
      - key: TRACKFLOW_CORS_ORIGINS
        sync: false
      # Carga los envíos semilla del plan de calidad (sección 6.5): TF000000000001 sin
      # movimientos, TF000000000002 en tránsito y TF000000000003 entregado. Los casos
      # CP-01 a CP-10 se ejecutan contra ellos. Solo se crean si aún no existen.
      - key: TRACKFLOW_SEED_ENABLED
        value: "true"
