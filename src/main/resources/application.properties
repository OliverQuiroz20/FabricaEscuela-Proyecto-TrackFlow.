spring.application.name=md_eventos

# Render (y cualquier PaaS) inyecta el puerto por la variable PORT.
server.port=${PORT:8080}

spring.datasource.url=${TRACKFLOW_DB_URL:jdbc:postgresql://localhost:5432/trackflow}
spring.datasource.username=${TRACKFLOW_DB_USER:postgres}
spring.datasource.password=${TRACKFLOW_DB_PASSWORD:postgres}

# El esquema lo gobiernan las migraciones de Flyway; Hibernate solo verifica que
# las entidades coincidan con las tablas y nunca las modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Las bases creadas antes de Flyway (por ddl-auto) se marcan como línea base en
# lugar de intentar recrear las tablas.
spring.flyway.baseline-on-migrate=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Los brokers gestionados (CloudAMQP) dan un vhost propio; en local es "/".
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Credenciales del operador para las operaciones de escritura. Clave vacía = protección
# desactivada, que es lo adecuado en local pero nunca en un entorno expuesto a internet.
trackflow.security.operador-usuario=${TRACKFLOW_OPERADOR_USUARIO:operador}
trackflow.security.operador-clave=${TRACKFLOW_OPERADOR_CLAVE:}
# El administrador puede además reconstruir proyecciones (/api/admin/**).
trackflow.security.admin-usuario=${TRACKFLOW_ADMIN_USUARIO:admin}
trackflow.security.admin-clave=${TRACKFLOW_ADMIN_CLAVE:}
trackflow.security.jwt-secret=${TRACKFLOW_JWT_SECRET:}
trackflow.security.duracion-token-minutos=${TRACKFLOW_TOKEN_MINUTOS:60}

# Orígenes que pueden llamar a la API desde un navegador, separados por comas. Por
# defecto, los servidores de desarrollo locales; en Render, el dominio del frontend.
trackflow.cors.allowed-origins=${TRACKFLOW_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mvc.problemdetails.enabled=true
server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html

# Swagger queda público a propósito: Calidad y la sustentación prueban la API desde
# ahí. Se declara explícito porque, si no, SpringDoc avisa en cada arranque que está
# "habilitado por defecto"; con TRACKFLOW_SWAGGER_ENABLED=false se apaga sin tocar código.
springdoc.api-docs.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${TRACKFLOW_SWAGGER_ENABLED:true}
